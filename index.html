<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇭🇰 HK Hike Recorder - Smart Drawing</title>
    
    <!-- Leaflet core -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Routing for road following -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <!-- GPX import/export -->
    <script src="https://cdn.jsdelivr.net/npm/togpx@0.5.4/togpx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>
    
    <!-- Custom styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-header">
        <div class="logo-area">
            <div class="logo-icon">🥾</div>
            <span>HK Hike Recorder</span>
        </div>
        
        <div class="mode-indicator" id="modeIndicator">
            <span id="modeText">Draw Line</span> Mode
            <span class="shortcut">(Press R to switch)</span>
        </div>
        
        <div class="action-buttons">
            <button id="undoBtn" title="Undo (Ctrl+Z)">↩️ Undo</button>
            <button id="redoBtn" title="Redo (Ctrl+Y)">↪️ Redo</button>
            <button id="importBtn" title="Import GPX">📂 Import</button>
            <button id="exportBtn" title="Export GPX">📥 Export</button>
            <button id="clearBtn" class="clear-btn">🗑️ Clear</button>
        </div>
    </div>

    <div id="map-container">
        <div id="map"></div>
        <div class="info-panel" id="infoPanel">
            <div class="tool-instructions">
                <strong>✏️ Mode: <span id="modeDisplay">Draw Line</span></strong><br>
                • <span>R</span> - Switch mode<br>
                • <span>E</span> - Finish route<br>
                • <span>Ctrl+Z</span> - Undo<br>
                • <span>Ctrl+Y</span> - Redo<br>
                • <span>Left click</span> - Add point<br>
                • <span>Right click</span> - Start free draw<br>
                • <span>Drag points</span> - Edit
            </div>
        </div>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="gpxImport" accept=".gpx,.xml" style="display: none">

    <script src="script.js"></script>
</body>
</html>
